<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>💎 DuoVerse Luxury · Live Cloud Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FIREBASE COMPAT SDK (Menghubungkan ke Cloud Server Google) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* LUXURY SYSTEM RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-body, #030712);
            color: var(--text-main);
            transition: background-color 0.5s ease;
        }

        /* DYNAMIC THEME SYSTEM VARS */
        .mode-dark {
            --bg-body: #040814;
            --bg-app: #060b18;
            --text-main: #f3f4f6;
            --text-muted: rgba(255, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --header-glass: rgba(6, 11, 24, 0.75);
            --card-hover-bg: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(0, 0, 0, 0.3);
            --bubble-other: rgba(255, 255, 255, 0.06);
            --bubble-other-text: #f3f4f6;
            --modal-overlay: rgba(2, 4, 8, 0.85);
            --shadow-premium: rgba(0, 0, 0, 0.5);
            
            --aurora-mizael-1: rgba(37, 99, 235, 0.23);
            --aurora-mizael-2: rgba(29, 78, 216, 0.12);
            --aurora-geyes-1: rgba(219, 39, 119, 0.23);
            --aurora-geyes-2: rgba(157, 23, 77, 0.12);
            --aurora-default-1: rgba(99, 102, 241, 0.15);
            --aurora-default-2: rgba(168, 85, 247, 0.12);
        }

        .mode-light {
            --bg-body: #f1f5f9;
            --bg-app: #f8fafc;
            --text-main: #0f172a;
            --text-muted: rgba(15, 23, 42, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(15, 23, 42, 0.08);
            --header-glass: rgba(255, 255, 255, 0.8);
            --card-hover-bg: rgba(15, 23, 42, 0.04);
            --input-bg: rgba(255, 255, 255, 0.9);
            --bubble-other: rgba(15, 23, 42, 0.06);
            --bubble-other-text: #0f172a;
            --modal-overlay: rgba(15, 23, 42, 0.4);
            --shadow-premium: rgba(15, 23, 42, 0.08);

            --aurora-mizael-1: rgba(191, 219, 254, 0.6);
            --aurora-mizael-2: rgba(219, 234, 254, 0.4);
            --aurora-geyes-1: rgba(251, 207, 232, 0.5);
            --aurora-geyes-2: rgba(252, 231, 243, 0.3);
            --aurora-default-1: rgba(221, 214, 254, 0.5);
            --aurora-default-2: rgba(243, 232, 255, 0.3);
        }

        /* CHARACTER THEME ENHANCEMENTS */
        .theme-default { --aurora-1: var(--aurora-default-1); --aurora-2: var(--aurora-default-2); --primary-glow: #6366f1; }
        .theme-mizael {
            --aurora-1: var(--aurora-mizael-1); --aurora-2: var(--aurora-mizael-2);
            --primary-glow: #2563eb;
            --bubble-me: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            --bubble-me-text: #ffffff;
            --border-highlight: rgba(59, 130, 246, 0.3);
        }
        .theme-geyes {
            --aurora-1: var(--aurora-geyes-1); --aurora-2: var(--aurora-geyes-2);
            --primary-glow: #db2777;
            --bubble-me: linear-gradient(135deg, #9d174d 0%, #f472b6 100%);
            --bubble-me-text: #ffffff;
            --border-highlight: rgba(244, 114, 182, 0.3);
        }

        /* FULLSCREEN CONTAINER WITH DYNAMIC AMBIENT */
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-app);
            transition: all 0.5s ease;
        }

        .app-container::before, .app-container::after {
            content: ''; position: absolute;
            width: 600px; height: 600px; border-radius: 50%;
            background: var(--aurora-1);
            filter: blur(130px); pointer-events: none; z-index: 0;
            animation: auroraFloat 22s infinite alternate ease-in-out;
            transition: all 0.8s ease;
        }
        .app-container::after {
            right: -5%; bottom: -5%;
            background: var(--aurora-2);
            animation-delay: -8s;
        }

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.15); }
            100% { transform: translate(-30px, 60px) scale(0.95); }
        }

        /* LUXURY HEADER ENGINE */
        .header {
            background: var(--header-glass);
            padding: 18px 28px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px var(--shadow-premium);
            z-index: 10; padding-top: max(18px, env(safe-area-inset-top));
        }

        .logo-area { display: flex; align-items: center; gap: 16px; }

        .logo-premium-box {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px var(--shadow-premium);
        }

        .title h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .title p { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        .header-controls { display: flex; align-items: center; gap: 12px; }

        .luxury-badge {
            background: var(--glass-bg); padding: 8px 18px; border-radius: 40px;
            font-weight: 700; font-size: 0.8rem; color: var(--text-main);
            display: flex; align-items: center; gap: 8px; border: 1px solid var(--glass-border);
        }

        /* MODERN ICON ACTIONS & THEME TOGGLER */
        .btn-action-icon {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-main); border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 1rem;
        }
        .btn-action-icon:hover { transform: scale(1.08); background: var(--card-hover-bg); }
        .btn-theme-toggle { font-size: 1.1rem; }
        .btn-clear-chat:hover { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

        /* BRANDING LOGIN PAGE */
        .login-screen {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 40px;
            z-index: 1; padding: 30px;
        }

        .login-theme-box { position: absolute; top: 20px; right: 20px; z-index: 50; }

        .premium-branding { text-align: center; animation: smoothFadeIn 0.8s ease; }
        .premium-branding h1 { font-size: 3.2rem; font-weight: 900; letter-spacing: -2px; color: var(--text-main); margin-bottom: 6px; }
        .premium-branding p { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }

        .avatar-choice { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; width: 100%; max-width: 600px; }

        .luxury-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            width: 225px; padding: 45px 25px;
            border-radius: 32px; text-align: center;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px var(--shadow-premium);
        }
        .luxury-card:hover { transform: translateY(-10px); background: var(--card-hover-bg); }
        .luxury-card[data-user="Mizael"]:hover { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 25px 45px -10px rgba(59, 130, 246, 0.3); }
        .luxury-card[data-user="Geyes"]:hover { border-color: rgba(244, 114, 182, 0.5); box-shadow: 0 25px 45px -10px rgba(244, 114, 182, 0.3); }

        .avatar-ring {
            width: 84px; height: 84px; margin: 0 auto 20px;
            background: rgba(255,255,255,0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 46px; border: 1px solid var(--glass-border);
            transition: all 0.4s;
        }
        .luxury-card:hover .avatar-ring { transform: scale(1.05); background: rgba(255,255,255,0.15); }

        .card-name { font-size: 1.45rem; font-weight: 800; color: var(--text-main); }
        .card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

        /* PASSWORD MODAL FRAME */
        .password-overlay {
            position: fixed; inset: 0;
            background: var(--modal-overlay); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .crystal-modal {
            background: var(--glass-bg);
            backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border);
            width: 92%; max-width: 370px;
            border-radius: 36px; padding: 45px 35px;
            text-align: center; box-shadow: 0 40px 80px var(--shadow-premium);
            animation: springPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes springPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .crystal-modal h3 { font-size: 1.55rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
        .crystal-modal p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.85rem; font-weight: 600; }

        .crystal-modal input {
            width: 100%; padding: 18px;
            border-radius: 18px; border: 1px solid var(--glass-border);
            background: var(--input-bg); color: var(--text-main);
            font-size: 1.3rem; margin-bottom: 20px; outline: none;
            text-align: center; letter-spacing: 6px; font-weight: bold;
            transition: all 0.3s;
        }
        .crystal-modal input:focus { border-color: var(--primary-glow); box-shadow: 0 0 20px var(--border-highlight, rgba(255,255,255,0.1)); }

        .crystal-modal button {
            background: var(--text-main); color: var(--bg-body); border: none;
            padding: 18px; border-radius: 18px; font-weight: 700;
            font-size: 0.95rem; cursor: pointer; width: 100%;
            transition: all 0.3s; letter-spacing: 0.5px;
        }

        /* CHAT FRAMEWORK */
        .chat-screen { flex: 1; display: flex; flex-direction: column; position: relative; }

        .messages-area {
            flex: 1; overflow-y: auto; padding: 30px;
            padding-bottom: 165px; display: flex; flex-direction: column; gap: 20px; z-index: 1;
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        /* ADVANCED CHAT BUBBLES */
        .message { display: flex; flex-direction: column; max-width: 75%; animation: messageSlidIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .message-left { align-self: flex-start; }
        .message-right { align-self: flex-end; }

        @keyframes messageSlidIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .bubble { padding: 15px 22px; position: relative; word-wrap: break-word; line-height: 1.6; font-size: 0.98rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--glass-border); }
        .message-left .bubble { background: var(--bubble-other); color: var(--bubble-other-text); border-radius: 24px 24px 24px 6px; }
        .message-right .bubble { background: var(--bubble-me); color: var(--bubble-me-text); border-radius: 24px 24px 6px 24px; border: 1px solid var(--border-highlight, transparent); box-shadow: 0 12px 35px rgba(0,0,0,0.12); }

        .sender-name { font-weight: 700; font-size: 0.72rem; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-muted); }
        .message-right .sender-name { justify-content: flex-end; color: rgba(255,255,255,0.7); }
        .timestamp { font-size: 0.62rem; text-align: right; margin-top: 6px; opacity: 0.5; font-weight: 600; }

        .empty-chat { align-self: center; margin: auto; text-align: center; background: var(--glass-bg); backdrop-filter: blur(20px); padding: 35px 45px; border-radius: 32px; border: 1px solid var(--glass-border); max-width: 85%; box-shadow: 0 20px 50px var(--shadow-premium); }

        /* CONSOLE & ACCESSORIES */
        .console-wrapper { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 720px; z-index: 20; display: flex; flex-direction: column; gap: 10px; }

        .emoji-bar { display: flex; gap: 8px; padding: 6px 14px; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid var(--glass-border); width: fit-content; align-self: center; box-shadow: 0 4px 15px var(--shadow-premium); }
        .emoji-item { cursor: pointer; font-size: 1.1rem; transition: transform 0.2s; user-select: none; }
        .emoji-item:hover { transform: scale(1.3); }

        .input-pod { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 8px; display: flex; gap: 12px; border-radius: 30px; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px var(--shadow-premium); align-items: center; }
        .input-pod input { flex: 1; border: none; background: transparent; color: var(--text-main); padding: 16px 20px; font-size: 1rem; font-weight: 500; outline: none; }
        .input-pod input::placeholder { color: var(--text-muted); }

        .input-pod button { background: var(--text-main); border: none; width: 48px; height: 48px; border-radius: 50%; color: var(--bg-body); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .input-pod button:hover { transform: scale(1.06) rotate(-10deg); background: var(--primary-glow); color: #fff; }

        .error-msg { color: #ff4757; font-size: 0.85rem; margin-top: 15px; font-weight: 600; }
        @keyframes smoothFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="mode-dark">
<div class="app-container theme-default" id="appContainer"></div>

<script>
    // =========================================================================
    // CONFIG DATABASE KAMU SUDAH OTOMATIS TERPASANG DI SINI 🚀
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyAh7xKGn6lucz62xL1Kw_HS1A4ujaacDrc",
        authDomain: "duoversechat.firebaseapp.com",
        databaseURL: "https://duoversechat-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "duoversechat",
        storageBucket: "duoversechat.firebasestorage.app",
        messagingSenderId: "904308431210",
        appId: "1:904308431210:web:8ac41245b6d000d4d8ad13",
        measurementId: "G-3XZW0RMFTZ"
    };

    // Inisialisasi Firebase Cloud Node
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ---------- IDENTITAS LOKAL ----------
    const LOCKED_USER_KEY = "locked_duo_user_password";
    const USERS = { MIZAEL: "Mizael", GEYES: "Geyes" };
    const PASSWORDS = { "Mizael": "mixo", "Geyes": "grace" };

    let currentThemeMode = localStorage.getItem("duo_theme_preference") || "dark";
    document.body.className = `mode-${currentThemeMode}`;

    let globalChatHistory = []; 

    // DETEKTOR REAL-TIME (Sinkronisasi Otomatis Antar HP)
    database.ref('messages').on('value', (snapshot) => {
        globalChatHistory = [];
        snapshot.forEach((childSnapshot) => {
            globalChatHistory.push(childSnapshot.val());
        });
        renderApp(); 
    });

    function toggleThemeMode() {
        currentThemeMode = currentThemeMode === "dark" ? "light" : "dark";
        localStorage.setItem("duo_theme_preference", currentThemeMode);
        document.body.className = `mode-${currentThemeMode}`;
        renderApp();
    }

    function addMessageCloud(sender, text) {
        if (!text.trim()) return;
        
        database.ref('messages').push({
            id: Date.now() + "_" + Math.random().toString(36).substr(2, 6),
            sender: sender,
            text: text.trim(),
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    }

    function getLockedUser() { return localStorage.getItem(LOCKED_USER_KEY); }
    function setLockedUser(user) {
        if (getLockedUser() !== null) return false;
        if (user === USERS.MIZAEL || user === USERS.GEYES) {
            localStorage.setItem(LOCKED_USER_KEY, user);
            return true;
        }
        return false;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function logoutUser() {
        localStorage.removeItem(LOCKED_USER_KEY);
        renderApp();
    }

    function clearChatHistoryCloud() {
        if(confirm("Apakah Anda yakin ingin menghapus seluruh riwayat pesan di Cloud Server secara permanen?")) {
            database.ref('messages').remove();
        }
    }

    function promptPasswordForUser(user, onSuccess) {
        const overlay = document.createElement('div');
        overlay.className = 'password-overlay';
        const modal = document.createElement('div');
        modal.className = 'crystal-modal';
        const userDisplay = user === 'Mizael' ? '💙 Mizael' : '🩷 Geyes';
        
        modal.innerHTML = `
            <h3>🔐 ${userDisplay}</h3>
            <p>Masukkan Kunci Enkripsi Ruangan</p>
            <input type="password" id="passInput" placeholder="••••" autocomplete="off">
            <button id="submitPass">VERIFIKASI & DEKRIPSI</button>
            <div id="passError" class="error-msg"></div>
        `;
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        const input = modal.querySelector('#passInput');
        const submitBtn = modal.querySelector('#submitPass');
        const errorDiv = modal.querySelector('#passError');

        const tryVerify = () => {
            const entered = input.value;
            const correct = PASSWORDS[user];
            if (entered === correct) {
                overlay.remove();
                onSuccess();
            } else {
                errorDiv.innerText = '❌ Kunci salah! Gagal mendekripsi.';
                input.value = '';
                input.focus();
                modal.style.transform = 'translateX(8px)';
                setTimeout(() => modal.style.transform = 'translateX(-8px)', 60);
                setTimeout(() => modal.style.transform = 'translateX(0)', 120);
            }
        };

        submitBtn.addEventListener('click', tryVerify);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') tryVerify(); });
        input.focus();
    }

    function renderApp() {
        const container = document.getElementById("appContainer");
        const lockedUser = getLockedUser();
        const modeIcon = currentThemeMode === "dark" ? "☀️" : "🌙";
        const themeBtnTitle = currentThemeMode === "dark" ? "Ubah ke Mode Terang" : "Ubah ke Mode Gelap";

        if (!lockedUser) {
            container.className = "app-container theme-default";
            container.innerHTML = `
                <div class="login-theme-box">
                    <button class="btn-action-icon btn-theme-toggle" id="themeToggleBtn" title="${themeBtnTitle}">${modeIcon}</button>
                </div>
                <div class="login-screen">
                    <div class="premium-branding">
                        <div class="logo-premium-box" style="margin: 0 auto 16px; width: 56px; height: 56px;">✨</div>
                        <h1>DuoVerse</h1>
                        <p>GEMI Private Room</p>
                    </div>
                    <div class="luxury-card" style="padding: 12px 24px; width: auto; border-radius: 40px; pointer-events: none; box-shadow: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;">
                        Pilih Profile Dulu
                    </div>
                    <div class="avatar-choice">
                        <div class="luxury-card" data-user="Mizael">
                            <div class="avatar-ring">🧑‍🚀</div>
                            <div class="card-name">Mizael</div>
                            <div class="card-sub">Klik untuk Akses 💙</div>
                        </div>
                        <div class="luxury-card" data-user="Geyes">
                            <div class="avatar-ring">🐱</div>
                            <div class="card-name">Geyes</div>
                            <div class="card-sub">Klik untuk Akses 🩷</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('themeToggleBtn').addEventListener('click', toggleThemeMode);
            const mCard = document.querySelector('.luxury-card[data-user="Mizael"]');
            const gCard = document.querySelector('.luxury-card[data-user="Geyes"]');

            if (mCard) {
                mCard.addEventListener('click', () => {
                    promptPasswordForUser(USERS.MIZAEL, () => { setLockedUser(USERS.MIZAEL); renderApp(); });
                });
            }
            if (gCard) {
                gCard.addEventListener('click', () => {
                    promptPasswordForUser(USERS.GEYES, () => { setLockedUser(USERS.GEYES); renderApp(); });
                });
            }
            return;
        }

        const currentUser = lockedUser;
        const otherUser = currentUser === USERS.MIZAEL ? USERS.GEYES : USERS.MIZAEL;
        const themeClass = currentUser === USERS.MIZAEL ? 'theme-mizael' : 'theme-geyes';

        let messagesHtml = '';
        if (globalChatHistory.length === 0) {
            messagesHtml = `
                <div class="empty-chat">
                    <div style="font-size: 32px; margin-bottom: 12px;">🌌</div>
                    <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Ruang Obrolan Cloud Aktif</div>
                    <div style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500; line-height: 1.5;">Belum ada pesan terkirim. Ketik pesan pertama Anda untuk menyinkronkan dengan perangkat ${otherUser}.</div>
                </div>`;
        } else {
            globalChatHistory.forEach(msg => {
                const isMe = (msg.sender === currentUser);
                const align = isMe ? 'message-right' : 'message-left';
                const senderIcon = msg.sender === USERS.MIZAEL ? '💙' : '🩷';
                messagesHtml += `
                    <div class="message ${align}">
                        <div class="bubble">
                            <div class="sender-name">
                                ${!isMe ? `<span>${senderIcon}</span> ${msg.sender}` : `${msg.sender} <span>${senderIcon}</span>`}
                            </div>
                            <div class="message-text">${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>
                            <div class="timestamp">${msg.timestamp}</div>
                        </div>
                    </div>
                `;
            });
        }

        container.className = `app-container ${themeClass}`;
        container.innerHTML = `
            <div class="header">
                <div class="logo-area">
                    <div class="logo-premium-box">💬</div>
                    <div class="title">
                        <h2>${currentUser}</h2>
                        <p>Login Sebagai ${currentUser}</p>
                    </div>
                </div>
                <div class="header-controls">
                    <button class="btn-action-icon btn-theme-toggle" id="themeToggleBtn" title="${themeBtnTitle}">${modeIcon}</button>
                    <button class="btn-action-icon btn-clear-chat" id="clearChatBtn" title="Hapus Riwayat Server">🗑️</button>
                    <button class="btn-action-icon" id="logoutBtn" title="Keluar / Ganti Akun">➡️</button>
                    <div class="luxury-badge">
                        ${currentUser === USERS.MIZAEL ? '💙' : '🩷'} ${currentUser}
                    </div>
                </div>
            </div>
            
            <div class="chat-screen">
                <div class="messages-area" id="messagesArea">
                    ${messagesHtml}
                </div>
                <div class="console-wrapper">
                    <div class="emoji-bar">
                        <span class="emoji-item">❤️</span>
                        <span class="emoji-item">✨</span>
                        <span class="emoji-item">💙</span>
                        <span class="emoji-item">🩷</span>
                        <span class="emoji-item">🥰</span>
                        <span class="emoji-item">🪐</span>
                        <span class="emoji-item">🌹</span>
                        <span class="emoji-item">🎵</span>
                    </div>
                    <div class="input-pod">
                        <input type="text" id="msgInput" placeholder="Ketik pesan aman sebagai ${currentUser}..." autocomplete="off">
                        <button id="sendBtn">✦</button>
                    </div>
                </div>
            </div>
        `;

        const msgContainer = document.getElementById('messagesArea');
        if (msgContainer) {
            setTimeout(() => msgContainer.scrollTop = msgContainer.scrollHeight, 60);
        }

        const inputField = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        function kirim() {
            const txt = inputField.value.trim();
            if (txt === "") return;
            addMessageCloud(currentUser, txt); 
            inputField.value = "";
        }

        sendBtn.addEventListener('click', kirim);
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); kirim(); } });

        document.getElementById('themeToggleBtn').addEventListener('click', toggleThemeMode);
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        document.getElementById('clearChatBtn').addEventListener('click', clearChatHistoryCloud);

        document.querySelectorAll('.emoji-item').forEach(item => {
            item.addEventListener('click', () => {
                inputField.value += item.innerText;
                inputField.focus();
            });
        });

        inputField.addEventListener('focus', () => {
            setTimeout(() => msgContainer.scrollTop = msgContainer.scrollHeight, 250);
        });
    }

    renderApp();
</script>
</body>
</html>
